[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultcore"
version = "1.0.0"
description = "VaultCore — одноразовый заверенный документ: Ed25519-подпись, PDF A4, офлайн-проверка"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VaultCore" }]
keywords = ["ed25519", "pdf", "document", "signature", "offline", "desktop"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "cryptography>=43.0",
  "reportlab>=4.0",
  "segno>=1.6",
  "PySide6>=6.6",
]

[project.optional-dependencies]
# macOS Keychain / Linux Secret Service
crossplatform = ["keyring>=24.0"]
dev = ["pytest>=8.0", "pypdf>=4.0", "pyinstaller>=6.0"]

[project.scripts]
vaultcore = "vaultcore.ui.app:main"
vaultcore-cli = "vaultcore.cli:main"

[project.urls]
Documentation = "https://example.org/vaultcore"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultcore = [
  "assets/*.md",
  "assets/fonts/*.ttf",
  "assets/fonts/*.otf",
  "templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vaultcore.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
